services:
  - type: web
    name: second-brain-mcp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: DATABASE_URL
        sync: false   # set manually in Render dashboard (your Neon connection string)
      - key: MCP_API_KEY
        sync: false   # set manually in Render dashboard (generate a long random string)
