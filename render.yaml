services:
  - type: web
    name: notes-mcp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      # This app's OWN accounts database (users, hashed API keys, encrypted
      # connection strings). NOT any individual user's personal notes DB --
      # create a separate small Neon project for this.
      - key: CONTROL_DATABASE_URL
        sync: false
      # Generate with:
      #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: ENCRYPTION_KEY
        sync: false
      # Generate with:
      #   python -c "import secrets; print(secrets.token_hex(32))"
      - key: SESSION_SECRET_KEY
        sync: false
      # Optional manual override; Render sets RENDER_EXTERNAL_URL automatically
      # for web services, so you usually don't need this.
      - key: BASE_URL
        sync: false
